services:
  pulse:
    build: .
    ports:
      # Loopback only: PULSE has no login, so never publish it on all interfaces.
      - "127.0.0.1:5001:5001"
    volumes:
      - ./data:/app/data
    environment:
      - PULSE_SECRET_KEY=${PULSE_SECRET_KEY:-}
      - PULSE_LOG_LEVEL=${PULSE_LOG_LEVEL:-INFO}
      - PULSE_MAX_UPLOAD_MB=${PULSE_MAX_UPLOAD_MB:-16}
    restart: unless-stopped
